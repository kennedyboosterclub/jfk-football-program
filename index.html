<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b2447" />
    <meta name="description" content="Bloomington Kennedy Football digital game-day program." />
    <title>Bloomington Kennedy Football | Game Day Program</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css?v=20260923-feedback1" />
    <script type="module" src="./app.js?v=20260923-feedback1"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="./" aria-label="Kennedy Football program home">
        <span class="brand-mark">K</span>
        <span><strong>Kennedy Football</strong><small id="load-status">Loading program…</small></span>
      </a>
      <div class="header-actions">
        <span class="page-count" id="page-count"></span>
        <button class="print-button" id="print-program" type="button">Print / Save PDF</button>
      </div>
    </header>
    <main>
      <div class="program-stack" id="program" aria-live="polite"></div>
    </main>
    <footer class="site-footer">
      <span>Bloomington Kennedy Football Booster Club</span>
      <span>Official game-day program</span>
    </footer>

    <button class="feedback-button" id="open-feedback" type="button" aria-haspopup="dialog" aria-controls="feedback-dialog">
      <span aria-hidden="true">✦</span>
      Feedback
    </button>

    <dialog class="feedback-dialog" id="feedback-dialog" aria-labelledby="feedback-title">
      <form class="feedback-form" id="feedback-form" action="https://formspree.io/f/mnpnvgln" method="POST">
        <div class="feedback-heading">
          <div>
            <p class="feedback-kicker">Help us improve</p>
            <h2 id="feedback-title">Send feedback</h2>
          </div>
          <button class="feedback-close" id="close-feedback" type="button" aria-label="Close feedback form">×</button>
        </div>

        <p class="feedback-intro">Tell the Kennedy Football Booster Club about a correction, site problem, or suggestion.</p>

        <label for="feedback-category">Feedback type</label>
        <select id="feedback-category" name="category" required>
          <option value="" selected disabled>Select a category</option>
          <option value="Site problem">Site problem</option>
          <option value="Program correction">Program correction</option>
          <option value="Sponsor information">Sponsor information</option>
          <option value="Accessibility issue">Accessibility issue</option>
          <option value="Suggestion">Suggestion</option>
          <option value="Other">Other</option>
        </select>

        <label for="feedback-message">Message</label>
        <textarea id="feedback-message" name="message" rows="5" maxlength="2000" required placeholder="Please include the page or section when reporting a correction."></textarea>

        <div class="feedback-contact-grid">
          <div>
            <label for="feedback-name">Name <span>(optional)</span></label>
            <input id="feedback-name" name="name" type="text" autocomplete="name" maxlength="100" />
          </div>
          <div>
            <label for="feedback-email">Email <span>(optional)</span></label>
            <input id="feedback-email" name="email" type="email" autocomplete="email" maxlength="254" />
          </div>
        </div>

        <input id="feedback-page" name="page_url" type="hidden" />
        <input id="feedback-subject" name="subject" type="hidden" value="JFK Booster website feedback" />

        <div class="feedback-status" id="feedback-status" role="status" aria-live="polite"></div>
        <div class="feedback-actions">
          <button class="feedback-cancel" id="cancel-feedback" type="button">Cancel</button>
          <button class="feedback-submit" id="submit-feedback" type="submit">Send feedback</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
